<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" color="white" type="image/png" href="/racing-finish-flag-24524_1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PitStop</title>
    <!-- Anti-FOUC script: Inyección síncrona para prevenir destellos antes del render -->
    <script>
      (function () {
        try {
          var storageKey = 'pitstop_theme';
          var saved = localStorage.getItem(storageKey);
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var isDark = saved === 'dark' || (saved !== 'light' && mql.matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
