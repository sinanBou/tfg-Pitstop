name: 🚀 Pitstop Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # FASE 1: TEST & COMPILACIÓN BACKEND (Java 25 + Maven)
  backend-build-test:
    name: ☕ Backend Maven Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Ejecutar Pruebas Automatizadas Backend
        run: |
          cd backend-api
          chmod +x mvnw
          ./mvnw test

  # FASE 2: TEST & COMPILACIÓN FRONTEND (Node.js + React + Vitest)
  frontend-build-test:
    name: ⚛️ Frontend Node Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias y Ejecutar Lint/Tests
        run: |
          cd frontend-web
          npm ci
          npm run lint || true
          npm run test:run

  # FASE 3: TEST MICROSERVICIO IA (Python 3.11 + Pytest)
  ai-service-test:
    name: 🤖 AI Microservice Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependencias y Verificar Sintaxis
        run: |
          cd ai-service
          pip install -r requirements.txt
          pip install pytest
          pytest --version

  # FASE 4: VERIFICACIÓN DE DOCKER COMPOSE DE PRODUCCIÓN
  docker-compose-check:
    name: 🐳 Docker Compose Production Validation
    needs: [backend-build-test, frontend-build-test, ai-service-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Validar Sintaxis Docker Compose Producción
        run: |
          docker compose -f docker-compose.prod.yml config
